<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carl Lindahl tar tåget</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Mali:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-tall column. Scenery band on top, the playfield in the middle, actions anchored at the bottom. Single daylight look, Swedish falu red and station ochre on winter sky. */
:root{
  --sky:#d4e9f1; --snow:#f3f6f4; --wall:#edf0ec; --floor:#e6dccb; --paper:#ffffff;
  --ink:#2e2320; --ink-soft:#5d4b44; --night:#1f3a30; --mute:#d8d2c8;
  --falu:#b8432c; --falu-dark:#8d2f1d; --ochre:#e6ad2e; --pine:#2f6a4e; --wood:#9b6a42;
  --heart:#de4f78; --breath:#3f93cc;
  --intro:#3f93cc; --expl:#c4553b; --appl:#e6ad2e; --free:#3f8a64;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Mali","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-weight:500;font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;background:var(--sky);overflow:hidden}
#screen{position:absolute;inset:0;display:flex;flex-direction:column}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--breath);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-0.12em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border:3px solid var(--ink);border-radius:14px;background:var(--falu);color:#fff;font-family:var(--display);font-size:19px;letter-spacing:.02em;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.small{min-height:46px;font-size:16px;padding:0 12px}
.btn .bi{width:26px;height:26px;display:inline-flex}
.btn .bi svg{width:100%;height:100%}
.chip{display:inline-flex;align-items:center;gap:5px;border:2.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;min-height:36px}
.linkbtn{background:none;border:0;padding:6px 0;font-weight:700;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

/* title */
.title-screen,.end-screen{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;background:var(--snow)}
.scene{background:var(--sky);border-bottom:3px solid var(--ink);flex:none}
.scene svg{display:block;width:100%;height:auto}
.title-copy{padding-block:14px 24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-family:var(--display);font-weight:400;line-height:.95;text-wrap:balance}
.t1{display:block;font-size:clamp(40px,12vw,54px);color:var(--falu);text-shadow:0 3px 0 var(--ink)}
.t2{display:block;font-size:clamp(28px,8.5vw,38px);color:var(--ink);margin-top:4px}
.lede{margin:0;font-size:15px;line-height:1.5;max-width:34ch}
.btns{display:flex;flex-direction:column;gap:10px}

/* map */
.map-screen{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--snow)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;background:var(--sky);border-bottom:3px solid var(--ink);flex:none}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.mtitle{font-family:var(--display);font-size:21px;line-height:1.05}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px 2px 6px;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.stat svg{width:18px;height:18px;color:var(--ochre)}
.map-scroll{flex:1;min-height:0;overflow-y:auto;position:relative;overscroll-behavior:contain}
.map-inner{position:relative;padding-block:28px 36px}
.mrow{position:relative;height:96px}
.mrow.fork{height:128px}
.rail{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rail path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:butt}
.rail .sl{stroke:#a98462;stroke-width:18;stroke-dasharray:3 8}
.rail .r1{stroke:var(--ink);stroke-width:9}
.rail .r2{stroke:#d9d4ca;stroke-width:3}
.rail .off{opacity:.3}
.pine{position:absolute;width:30px;height:40px;pointer-events:none}
.pine.s{width:22px;height:30px}
.mnode{position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:grid;place-items:center;padding:6px;box-shadow:0 3px 0 var(--ink);z-index:2}
.mnode svg{width:100%;height:100%}
.mnode.fl{left:28%}.mnode.fr{left:72%}
.mnode.future{background:#e9ecea}
.mnode.future svg,.mnode.skipped svg{filter:grayscale(1);opacity:.55}
.mnode.skipped{background:#eceae6;box-shadow:none}
.mnode.next{animation:pulse 1.1s ease-in-out infinite;background:#fff6d9}
.mlabel{position:absolute;left:calc(50% + 38px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px}
.mlabel .nm{font-family:var(--display);font-size:19px;line-height:1}
.mlabel .sub{font-size:12px;font-weight:700;color:var(--ink-soft)}
.mstars{display:flex;gap:1px}
.mstars svg{width:15px;height:15px;color:var(--mute)}
.mstars svg.on{color:var(--ochre)}
.flabel{position:absolute;top:calc(50% + 31px);transform:translateX(-50%);font-size:12px;font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 7px;white-space:nowrap;z-index:2}
.flabel.fl{left:28%}.flabel.fr{left:72%}
.train{position:absolute;left:0;top:0;width:30px;height:48px;margin:-24px 0 0 -15px;transition:transform 1s cubic-bezier(.55,0,.35,1);z-index:5;pointer-events:none}
.train svg{width:100%;height:100%;display:block}
.mpanel{flex:none;border-top:3px solid var(--ink);background:var(--paper);padding-block:12px 14px;display:flex;flex-direction:column;gap:10px}
.mpanel p{margin:0;font-size:14.5px;line-height:1.4}
.mpanel p b{font-family:var(--display);font-weight:400;font-size:17px}
.forkbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* battle */
.battle{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--wall)}
.bbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px;background:var(--sky);border-bottom:3px solid var(--ink)}
.bsub{font-size:11px;color:var(--ink-soft);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.bst{font-family:var(--display);font-size:21px;line-height:1}
.depart{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:4px 12px 4px 9px;font-weight:700;font-size:13px;white-space:nowrap}
.depart svg{font-size:16px}
.depart.last{background:#fde3dc;color:var(--falu-dark);animation:wobble 1.2s ease-in-out infinite}
.helpbtn{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);font-family:var(--display);font-size:19px;padding:0;line-height:1}
.nave{flex:1;min-height:0;position:relative;display:grid;column-gap:10px;row-gap:24px;padding-block:24px 10px;overflow:hidden}
.nave.n3{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.nave.n4{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.nave-deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.seat{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:0;min-width:0;border:0;background:none;padding:0;border-radius:14px;text-align:center}
.portrait{position:relative;flex:0 1 auto;width:100%;aspect-ratio:120/116;min-height:44px;display:block}
.portrait svg.person{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 100%;animation:bob 3.4s ease-in-out infinite}
.seat:nth-child(3) svg.person{animation-delay:-1.1s}
.seat:nth-child(4) svg.person{animation-delay:-2.2s}
.seat:nth-child(5) svg.person{animation-delay:-.6s}
.seat.amen svg.person{animation:hop .5s ease-out 1}
.halo{position:absolute;left:50%;top:8%;width:min(78%,96px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:#fbe8a8;border:3px dashed var(--ochre)}
.pew{position:relative;z-index:2;margin-top:-14px;height:26px;background:var(--wood);border:3px solid var(--ink);border-radius:10px 10px 5px 5px;display:flex;align-items:center;justify-content:center;padding:0 4px;min-width:0}
.pname{font-family:var(--display);font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.meter{display:flex;align-items:center;gap:4px;margin-top:5px;height:16px}
.meter .hico{color:var(--heart);font-size:15px;display:inline-flex}
.track{flex:1;height:11px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;min-width:0}
.fill{display:block;height:100%;background:var(--heart);transition:width .35s ease-out}
.seat.amen .fill{background:var(--ochre)}
.num{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
.intent{position:absolute;top:-17px;left:50%;transform:translateX(-50%);z-index:3;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;font-size:11px;font-weight:700;padding:1px 8px;border:2px solid var(--ink);border-radius:999px;background:#fff}
.intent svg{font-size:12px}
.k-bad{background:#fde3dc;color:#8d2f1d}.k-shield{background:#dcecf8;color:#1f4e73}.k-calm{background:#efede8;color:#5d4b44}.k-good{background:#dff0e3;color:#1f5c3b}.k-sleep{background:#e8e3f6;color:#4b3f7a}
.shieldb{position:absolute;left:2%;top:34%;z-index:3;display:inline-flex;align-items:center;gap:2px;background:#dcecf8;color:#1f4e73;border:2px solid var(--ink);border-radius:9px;padding:0 6px;font-family:var(--display);font-size:14px}
.amen-tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(-6deg);z-index:3;background:var(--ochre);border:2.5px solid var(--ink);border-radius:9px;padding:0 9px;font-family:var(--display);font-size:15px;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.seat.target .portrait::after{content:"";position:absolute;inset:2px 4% -10px;border:3px dashed var(--ochre);border-radius:16px;z-index:1;animation:dash 1s linear infinite}
.preview{position:absolute;right:0;top:30%;z-index:4;background:var(--ochre);color:var(--ink);border:2.5px solid var(--ink);border-radius:10px;padding:0 7px;font-family:var(--display);font-size:17px;box-shadow:0 2px 0 var(--ink);white-space:nowrap;line-height:1.3}
.preview small{font-size:12px;margin-left:2px}

.pulpit{flex:none;display:grid;grid-template-columns:80px minmax(0,1fr);gap:4px 12px;padding-block:8px 2px;background:var(--floor);border-top:3px solid var(--ink)}
.carlbox{position:relative;height:80px}
.carlbox svg.person{position:absolute;left:2px;right:2px;top:0;width:calc(100% - 4px);height:64px}
.lectern{position:absolute;left:4px;right:4px;bottom:0;height:30px;background:var(--wood);border:3px solid var(--ink);border-radius:7px 7px 3px 3px}
.cloth{position:absolute;left:50%;top:-3px;width:26px;height:26px;transform:translateX(-50%);background:var(--falu);border:3px solid var(--ink);border-radius:0 0 8px 8px;display:grid;place-items:center}
.cloth svg{width:14px;height:14px}
.cbadge{position:absolute;z-index:3;font-size:11px;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:0 6px;white-space:nowrap}
.cbadge.dbl{top:-4px;left:-6px;background:var(--ochre)}
.cbadge.pen{top:-4px;right:-8px;background:#fde3dc;color:#8d2f1d}
.say{align-self:center;position:relative;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:13px;line-height:1.35;font-weight:600;min-height:52px;display:flex;align-items:center}
.say::before{content:"";position:absolute;left:-10px;top:50%;width:14px;height:14px;background:#fff;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.say span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pips{display:flex;align-items:center;justify-content:center;gap:1px;height:24px}
.pip{font-size:20px;color:var(--breath);display:inline-flex}
.pip.used{color:#c6d2d8}
.pips.many .pip{font-size:15px}
.thread{display:flex;gap:4px;align-items:center;height:24px;flex-wrap:nowrap;min-width:0}
.tp{font-size:11px;font-weight:700;padding:0 6px;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--ink-soft);white-space:nowrap;line-height:17px}
.tp.on.i{background:var(--intro);color:#fff}.tp.on.u{background:var(--expl);color:#fff}.tp.on.t{background:var(--appl);color:var(--ink)}
.tp.nx{box-shadow:0 0 0 3px #f6d979}
.thread.flash .tp{animation:hop .5s ease-out 1}

.hand{flex:none;display:grid;gap:6px;padding-block:16px 6px;background:var(--floor)}
.hand .empty{grid-column:1/-1;margin:0;height:140px;display:grid;place-items:center;font-weight:700;color:var(--ink-soft)}
.card{--card-h:142px;--role:var(--free);position:relative;height:var(--card-h);min-width:0;display:flex;flex-direction:column;align-items:center;padding:19px 3px 6px;gap:1px;border:3px solid var(--ink);border-radius:13px;background:#fff;box-shadow:0 4px 0 var(--ink);transition:transform .16s ease,box-shadow .16s ease,filter .16s;text-align:center}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:13px;background:var(--role);border-bottom:3px solid var(--ink);border-radius:9px 9px 0 0}
.card.r-i{--role:var(--intro)}.card.r-u{--role:var(--expl)}.card.r-t{--role:var(--appl)}.card.r-f{--role:var(--free)}
.card.sel{transform:translateY(-12px);box-shadow:0 7px 0 var(--ink),0 0 0 4px #f6d979}
.card.dim{filter:grayscale(.85) brightness(.97);box-shadow:0 2px 0 var(--ink)}
.card.upg{background:#fffaea}
.card.sold{opacity:.55;filter:grayscale(1)}
.cost{position:absolute;top:-11px;left:-10px;width:29px;height:29px;border-radius:50%;background:var(--breath);border:3px solid var(--ink);color:#fff;font-family:var(--display);font-size:17px;display:grid;place-items:center;z-index:2;line-height:1}
.tmark{position:absolute;top:-10px;right:-9px;width:24px;height:24px;border-radius:50%;background:var(--falu);border:3px solid var(--ink);z-index:2;display:grid;place-items:center}
.tmark svg{width:13px;height:13px}
.cname{font-family:var(--display);font-size:12px;line-height:1.05;min-height:2.15em;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere;hyphens:manual}
.cart{width:32px;height:32px;flex:none;margin:1px 0}
.cart svg{width:100%;height:100%;display:block}
.ctext{font-size:11px;font-weight:700;line-height:1.15;flex:1;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.ctext svg{color:var(--heart);font-size:11px;margin:0 1px}
.ctag{font-size:11px;font-weight:700;color:var(--ink-soft);line-height:1.1}
.price{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);background:var(--ochre);border:2.5px solid var(--ink);border-radius:999px;padding:0 9px;font-family:var(--display);font-size:14px;white-space:nowrap}
.price.sold{background:var(--mute)}
.hand.deal .card{animation:deal .32s ease-out backwards}
.hand.deal .card:nth-child(2){animation-delay:.05s}.hand.deal .card:nth-child(3){animation-delay:.1s}.hand.deal .card:nth-child(4){animation-delay:.15s}.hand.deal .card:nth-child(5){animation-delay:.2s}.hand.deal .card:nth-child(6){animation-delay:.25s}

.controls{flex:none;display:flex;align-items:center;gap:10px;padding-block:6px 12px;background:var(--floor)}
.hint{flex:1;min-width:0;margin:0;font-size:12.5px;line-height:1.3;font-weight:600;color:var(--ink-soft)}
.endbtn{min-height:48px;padding:0 16px;font-size:18px;flex:none}
.endbtn.pulse{animation:pulse 1s ease-in-out infinite}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(46,35,32,.5);z-index:20;animation:fade .2s ease-out}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow-y:auto;background:var(--paper);border-top:3px solid var(--ink);border-radius:22px 22px 0 0;padding-block:20px 22px;display:flex;flex-direction:column;gap:12px;animation:up .3s cubic-bezier(.2,.9,.3,1.1)}
.sheet h2,.node-body h2,.end-copy h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05;text-wrap:balance;padding-right:36px}
.sheet h3{margin:4px 0 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.sheet p,.node-body p{margin:0;font-size:14.5px;line-height:1.5}
.x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;font-size:22px;line-height:1;padding:0;font-family:var(--display)}
.sign{align-self:flex-start;font-family:var(--display);font-size:30px;background:#fff;border:3px solid var(--ink);border-radius:9px;padding:2px 20px;box-shadow:0 3px 0 var(--ink);letter-spacing:.03em;position:relative;margin-bottom:6px}
.sign::before,.sign::after{content:"";position:absolute;bottom:-11px;width:5px;height:9px;background:var(--ink)}
.sign::before{left:18px}.sign::after{right:18px}
.crowd{display:grid;gap:8px}
.crowd-p{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.crowd-p svg{width:100%;max-width:74px;height:66px}
.fine{font-size:13px!important;color:var(--ink-soft)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{position:relative;padding-left:22px;font-size:14px;line-height:1.5}
.rules li::before{content:"";position:absolute;left:2px;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--falu);border:2px solid var(--ink)}
.rules b{font-weight:700}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:46px;height:46px;color:var(--mute)}
.bigstars svg.on{color:var(--ochre);animation:starpop .45s ease-out backwards}
.bigstars svg.on:nth-child(2){animation-delay:.15s}.bigstars svg.on:nth-child(3){animation-delay:.3s}
.tally{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.tally li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.tally .ok{color:var(--pine)}.tally .no{color:var(--ink-soft)}
.tally .mk{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:12px;flex:none;background:#fff}
.tally .ok .mk{background:var(--ochre)}
.earn{font-family:var(--display);font-size:22px}
.reward{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:12px}
.reward .card,.kgrid .card{--card-h:152px}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:16px 8px;padding-top:12px}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:12px;padding-bottom:12px}
.single{display:grid;grid-template-columns:110px;padding-top:12px}

/* nodes */
.node-screen{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;background:var(--snow)}
.node-body{padding-block:16px 26px;display:flex;flex-direction:column;gap:12px}
.optlist{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 14px;box-shadow:0 3px 0 var(--ink);min-height:58px;width:100%}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt .oart{width:40px;height:40px;flex:none}
.opt .oart svg{width:100%;height:100%}
.opt b{font-family:var(--display);font-weight:400;font-size:17px;display:block;line-height:1.15}
.opt small{display:block;font-size:13px;color:var(--ink-soft);font-weight:600;line-height:1.35;margin-top:2px}
.gain{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:18px;background:#fff6d9;border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px}
.gain svg{color:var(--ochre);font-size:22px}
.end-copy{padding-block:16px 26px;display:flex;flex-direction:column;gap:12px}
.end-list{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.end-list li{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;font-size:14px;border-bottom:2px dotted var(--mute);padding-bottom:3px}

/* effects */
#fx{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.float{position:absolute;transform:translate(-50%,0);font-family:var(--display);font-size:24px;color:var(--heart);white-space:nowrap;animation:floatUp 1.15s ease-out forwards;text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,0 3px 0 var(--ink)}
.float.info{color:var(--pine);font-size:17px}
.float.shield{color:#1f4e73;font-size:16px}
.float.bad{color:var(--falu-dark);font-size:20px}
.float.note{color:var(--ink);font-size:15px}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:3px 10px;font-weight:700;font-size:13px;white-space:nowrap;animation:bubble 1.5s ease forwards;box-shadow:0 2px 0 var(--ink)}
.bubble.amen{background:var(--ochre);font-family:var(--display);font-weight:400;font-size:16px}
.big{position:absolute;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:44px;color:var(--falu);text-shadow:0 3px 0 var(--ink),2px 0 #fff,-2px 0 #fff;animation:bigPop 1.3s ease forwards;white-space:nowrap}
.big.gold{color:var(--ochre)}
.toast{position:absolute;left:16px;right:16px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-size:13.5px;line-height:1.45;animation:toast 3.4s ease forwards}
.toast b{font-family:var(--display);font-weight:400;font-size:16px;color:#f6d979}
.shake{animation:shake .45s ease-in-out 1}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) rotate(.7deg)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-8px) scale(1.04)}100%{transform:translateY(0) scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
@keyframes dash{0%,100%{border-color:var(--ochre)}50%{border-color:#f6d979}}
@keyframes deal{from{transform:translateY(40px) rotate(6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
@keyframes bubble{0%{opacity:0;transform:translate(-50%,-80%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1.06)}20%{transform:translate(-50%,-100%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%)}}
@keyframes bigPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(-3deg)}80%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
@keyframes toast{0%{opacity:0;transform:translateY(10px)}8%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-2deg)}40%{transform:translateX(5px) rotate(2deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@media (max-height:640px){
  .card{--card-h:124px;padding-top:16px}.cart{width:26px;height:26px}
  .carlbox{height:68px}.carlbox svg.person{height:54px}.lectern{height:26px}.say{min-height:44px;font-size:12.5px}
  .hand{padding-block:14px 4px}.nave{row-gap:22px;padding-block:22px 6px}
  .bbar{padding-block:6px}.mrow{height:84px}.mrow.fork{height:114px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .float,.bubble,.big,.toast{animation:none!important}
}
</style>

<div id="app"><div id="screen"></div><div id="fx" aria-live="polite"></div></div>

<script>
(() => {
'use strict';
const INK = '#2e2320';
const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const $ = (s, r = document) => r.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 160) : ms));
let uidN = 1;
const uid = () => 'c' + Date.now().toString(36) + (uidN++);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const plain = s => String(s).replace(/­/g, '').replace(/\{h\}/g, 'hjärtan');

/* ---------- small icons ---------- */
const ICONS = {

const ART = {

/* ---------- cartoon people ---------- */
const SK = { a: '#f3cba9', b: '#e6a985', c: '#d39a72', d: '#f7d9c3', e: '#b9805a' };
function eyes(x1, x2, y, mood) {
  let s = '';
  for (const x of [x1, x2]) {
    if (mood === 'sleep') s += `<path d="M${x - 5} ${y} q5 4.5 10 0" fill="none"/>`;
    else if (mood === 'amen') s += `<path d="M${x - 5} ${y + 2} q5 -7 10 0" fill="none"/>`;
    else if (mood === 'bored') s += `<circle cx="${x}" cy="${y + 1.6}" r="2.6" fill="${INK}" stroke="none"/><path d="M${x - 5} ${y - 0.4} h10"/>`;
    else s += `<circle cx="${x}" cy="${y}" r="3.3" fill="${INK}" stroke="none"/><circle cx="${x + 1.2}" cy="${y - 1.3}" r="1.1" fill="#fff" stroke="none"/>`;
  }
  if (mood === 'happy' || mood === 'talk') s += `<path d="M${x1 - 5} ${y - 9} q5 -3 10 0 M${x2 - 5} ${y - 9} q5 -3 10 0" fill="none" stroke-width="2.4"/>`;
  if (mood === 'stern') s += `<path d="M${x1 - 6} ${y - 10} l11 4 M${x2 + 6} ${y - 10} l-11 4" fill="none" stroke-width="3"/>`;
  return s;
}
function mouth(x, y, mood) {
  switch (mood) {
    case 'sleep': return `<ellipse cx="${x}" cy="${y + 1}" rx="3" ry="2.5" fill="#7c2e2b"/>`;
    case 'bored': return `<path d="M${x - 7} ${y + 1} q7 -2 14 0.6" fill="none"/>`;
    case 'stern': return `<path d="M${x - 7} ${y + 2} q7 -3 14 0" fill="none"/>`;
    case 'happy': return `<path d="M${x - 9} ${y - 1} q9 9 18 0" fill="none"/>`;
    case 'talk': return `<path d="M${x - 7} ${y - 2} q7 -1 14 0 q-1 9 -7 9 q-6 0 -7 -9z" fill="#7c2e2b"/>`;
    case 'amen': return `<path d="M${x - 10} ${y - 2} q10 -1 20 0 q-2 12 -10 12 q-8 0 -10 -12z" fill="#7c2e2b"/><path d="M${x - 5} ${y + 7} q5 -4 10 0" fill="#e86f7e" stroke="none"/>`;
    default: return `<path d="M${x - 7} ${y} q7 4.5 14 0" fill="none"/>`;
  }
}
function face(cx, cy, mood, gap = 11) {
  const ey = cy + 2;
  const blush = (mood === 'happy' || mood === 'amen' || mood === 'talk')
    ? `<ellipse cx="${cx - gap - 4}" cy="${ey + 9}" rx="5" ry="3" fill="#f2899c" stroke="none" opacity=".6"/><ellipse cx="${cx + gap + 4}" cy="${ey + 9}" rx="5" ry="3" fill="#f2899c" stroke="none" opacity=".6"/>` : '';

}
const HEAD = (cx, cy, r, skin) => `<circle cx="${cx - r + 2}" cy="${cy + 4}" r="6" fill="${skin}"/><circle cx="${cx + r - 2}" cy="${cy + 4}" r="6" fill="${skin}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="${skin}"/>`;

    case 'nord': return `${SHOULD('#e8853a')}<path d="M20 101 H100" stroke="#f4dd4a" stroke-width="6"/><path d="M40 80 L50 88 M80 80 L70 88" stroke-width="2.4"/>

      ${HEAD(60, 52, 26, SK.a)}
      <path d="M33 52 Q30 22 60 22 Q90 22 87 52 Q85 40 74 38 L46 38 Q35 40 33 52Z" fill="#3b3029"/>
      ${face(60, 52, mood)}
      <rect x="40.5" y="47" width="17" height="14" rx="3.5" fill="none" stroke-width="2.6"/><rect x="62.5" y="47" width="17" height="14" rx="3.5" fill="none" stroke-width="2.6"/><path d="M57.5 53 h5" stroke-width="2.4"/>`;
    case 'familj': {

let AC = null;
function ensureAudio() {
  if (muted) return;
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; }
}
function tone(f, t0, dur, type = 'triangle', vol = .12, to) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + .05);
}
function sfx(n) {
  if (muted || !AC) return;
  try {
    const t = AC.currentTime;
    if (n === 'card') { tone(520, t, .09); tone(780, t + .05, .1, 'triangle', .08); }
    else if (n === 'amen') { tone(660, t, .2, 'sine', .14); tone(880, t + .12, .35, 'sine', .14); }
    else if (n === 'boop') tone(240, t, .16, 'triangle', .07, 150);
    else if (n === 'whistle') { tone(740, t, .38, 'triangle', .13); tone(587, t + .42, .55, 'triangle', .13); }
    else if (n === 'coin') { tone(988, t, .07, 'square', .04); tone(1318, t + .07, .14, 'square', .04); }
    else if (n === 'thread') [523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * .07, .18, 'triangle', .1));
    else if (n === 'nope') tone(180, t, .14, 'triangle', .08);
    else if (n === 'chug') for (let i = 0; i < 4; i++) tone(120, t + i * .2, .1, 'square', .03, 90);
  } catch (e) {}
}

function moodOf(l) {

}
async function playCard(i, ti) {
  const b = S.battle; if (b.busy || b.ended) return;
  const c = b.hand[i]; if (!c) return;
  const d = cardDef(c);
  if (d.cost > b.breath) return;
  b.breath -= d.cost; b.hand.splice(i, 1); if (!d.exhaust) b.discard.push(c);
  b.sel = null; b.played = true;
  const th = threadNext(b, d.role); b.thread = th.next; const threadDone = th.done;
  const dbl = b.double && d.hearts > 0; if (dbl) b.double = false;
  const fx = []; let amens = 0;
  if (d.special === 'wake' || d.special === 'stop') b.listeners.forEach((l, k) => { if (l.asleep && !l.amen) { l.asleep = false; fx.push({ k, text: 'Vaknade!', kind: 'info' }); } });
  if (d.special === 'stop') { b.stop = true; fx.push({ top: 'depart', text: 'Inga störningar denna tur', kind: 'info' }); }
  const targets = d.target === 'all' ? b.listeners.map((l, k) => k) : d.target === 'one' && ti != null ? [ti] : [];
  for (const k of targets) {
    const l = b.listeners[k]; if (l.amen) continue;
    if (l.asleep) {
      if (d.target === 'one') { l.asleep = false; fx.push({ k, text: 'Vaknade!', kind: 'info' }); }
      else if (d.hearts > 0) fx.push({ k, text: 'Sover', kind: 'note' });
      continue;
    }
    if (d.hearts > 0) {
      const mult = (threadDone ? (l.type === 'biskop' ? 3 : 2) : 1) * (dbl ? 2 : 1);
      const g = gain(l, d, mult);
      const r = applyHearts(l, g.amount, d.special === 'unshield');
      if (r.absorbed) fx.push({ k, text: 'Skydd −' + r.absorbed, kind: 'shield' });
      if (r.added) fx.push({ k, text: '+' + r.added, kind: 'heart', note: threadDone ? 'tråd' : g.note });
      if (r.amenNow) { fx.push({ k, amen: true }); amens++; }
    } else if (d.special === 'unshield' && l.shield) { l.shield = 0; }
  }
  if (d.splash) b.listeners.forEach((l, k) => { if (k === ti || l.amen || l.asleep) return; const r = applyHearts(l, d.splash); if (r.added) fx.push({ k, text: '+' + r.added, kind: 'heart' }); if (r.amenNow) { fx.push({ k, amen: true }); amens++; } });
  if (d.special === 'breath') { b.breath += d.amount; fx.push({ top: 'breath', text: '+' + d.amount + ' andetag', kind: 'info' }); }
  if (d.special === 'turn') { b.turnsLeft += 1; fx.push({ top: 'depart', text: 'Försenat! +1 tur', kind: 'info' }); }
  if (d.special === 'double') b.double = true;
  if (d.special === 'draw') drawCards(d.amount);
  b.said = pick(d.lines).replace('{stad}', STATIONS[b.st].name);
  b.carlMood = 'talk'; b.threadFlash = threadDone;
  sfx('card');
  render(); runFx(fx);
  if (threadDone) { sfx('thread'); bigText('Röd tråd!', ''); }
  if (amens) setTimeout(() => sfx('amen'), 250);
  if (b.listeners.every(l => l.amen)) { b.busy = true; await sleep(1100); bigText('Alla sa amen!', 'gold'); await sleep(900); finishBattle(true); }
}
async function endTurn() {
  const b = S.battle; if (!b || b.busy || b.ended) return;
  b.busy = true; b.sel = null;
  b.discard.push(...b.hand); b.hand = []; b.carlMood = 'ok'; render();
  if (b.stop) { bigText('Tyst i kyrkan!'); await sleep(700); }
  else {
    for (let k = 0; k < b.listeners.length; k++) {
      const l = b.listeners[k]; if (l.amen) continue;
      if (l.asleep) { bubbleAt(k, 'Zzz…'); await sleep(260); continue; }
      const I = INTENTS[l.intent]; if (!I) continue;
      const res = I.run(l, b, k) || [];
      render(); bubbleAt(k, pick(I.say)); runFx(res);
      if (I.kind === 'bad') { shakeSeat(k); sfx('boop'); }
      if (res.some(f => f.amen)) setTimeout(() => sfx('amen'), 200);
      await sleep(560);
      if (b.listeners.every(x => x.amen)) break;
    }
  }
  b.stop = false;
  if (b.listeners.every(l => l.amen)) { await sleep(400); bigText('Alla sa amen!', 'gold'); await sleep(900); return finishBattle(true); }
  b.turnsLeft--;
  if (b.turnsLeft <= 0) { sfx('whistle'); b.said = 'Oj, där visslar tåget. Amen, allihop!'; b.carlMood = 'talk'; render(); bigText('TUUT!'); await sleep(1300); return finishBattle(false); }
  b.turn++;
  b.listeners.forEach(l => { if (!l.amen) { const P = TYPES[l.type].pattern; l.ip = (l.ip + 1) % P.length; l.intent = P[l.ip]; } });
  b.breath = Math.max(1, 3 - b.penalty); b.penalty = 0; b.thread = 0; b.double = false;
  drawCards(4); b.justDealt = true; b.said = pick(TURN_LINES); b.carlMood = 'happy'; b.busy = false;
  render();
  if (b.turnsLeft === 1) bigText('Sista turen!');
}
function finishBattle(all) {
  const b = S.battle; if (!b || b.ended) return;
  b.ended = true; b.busy = false;
  const n = b.listeners.length, amens = b.listeners.filter(l => l.amen).length;
  const stars = amens === n ? 3 : amens >= Math.ceil(n / 2) ? 2 : amens >= 1 ? 1 : 0;
  let kr = 0;
  b.listeners.forEach(l => { kr += l.amen ? 10 * (TYPES[l.type].kr || 1) : Math.floor(5 * l.hearts / l.max); });
  const early = all ? Math.max(0, b.turnsLeft - 1) * 5 : 0; kr += early;
  S.kollekt += kr; S.stars[b.st] = Math.max(S.stars[b.st] || 0, stars);
  S.result = { stars, amens, n, kollekt: kr, early, final: !!STATIONS[b.st].final, names: b.listeners.map(l => ({ name: l.name, amen: l.amen })) };
  S.rewardOpts = shuffle(REWARD_POOL.slice()).slice(0, 3);
  S.rowDone = true; S.sheet = 'result';
  render(); sfx(stars >= 2 ? 'thread' : 'coin');
}
function afterBattle() { S.battle = null; S.sheet = null; S.screen = 'map'; S.tutorial = false; render(); }

/* ---------- travel and nodes ---------- */
function travel() {
  const from = S.pos; S.pos++; S.rowDone = false; S.sheet = null;
  UI.trainFrom = from; UI.moving = true; render(); sfx('chug');
  setTimeout(() => { UI.moving = false; UI.trainFrom = null; S.sheet = 'arrival'; render(); }, reduced ? 60 : 1150);
}
function chooseFork(i) {
  const N = ROWS[S.pos + 1]; if (!N || N.kind !== 'fork' || !S.rowDone) return;
  const from = S.pos; S.pos++; S.choices[S.pos] = i; S.rowDone = false; S.node = null;
  UI.trainFrom = from; UI.moving = true; render(); sfx('chug');
  setTimeout(() => { UI.moving = false; UI.trainFrom = null; enterNode(); }, reduced ? 60 : 1150);
}
function enterNode() {
  const R = ROWS[S.pos]; if (R.kind !== 'fork') return;
  if (!S.node || S.node.pos !== S.pos) {
    const type = S.forks[R.f][S.choices[S.pos]];
    if (type === 'kiosk') S.node = { pos: S.pos, type, stock: shuffle(REWARD_POOL.slice()).slice(0, 3).map(id => ({ id, price: PRICE[id], sold: false })) };
    else if (type === 'konduktor') { const left = EVENTS.filter(e => !S.usedEvents.includes(e.id)); const ev = pick(left.length ? left : EVENTS); S.usedEvents.push(ev.id); S.node = { pos: S.pos, type, ev: ev.id, out: null }; }
    else S.node = { pos: S.pos, type, stage: 'menu' };
  }
  S.screen = 'node'; render(); screenEl().firstElementChild && (screenEl().firstElementChild.scrollTop = 0);
}
function upgradeCard(c) { c.up = true; return `${plain(CARDS[c.id].name)} blev ${plain(CARDS[c.id].name)}+`; }
function applyEventFx(fx) {
  if (fx.card) { S.deck.push({ uid: uid(), id: fx.card, up: !!fx.up }); return 'Nytt kort: ' + plain(CARDS[fx.card].name) + (fx.up ? '+' : ''); }
  if (fx.kr) { S.kollekt += fx.kr; sfx('coin'); return `+${fx.kr} kr i kollekten`; }
  if (fx.breath) { S.bonusBreath = (S.bonusBreath || 0) + fx.breath; return 'Ett extra andetag i nästa gudstjänst'; }
  if (fx.upId) { const c = S.deck.find(x => x.id === fx.upId && !x.up); if (c) return upgradeCard(c); S.deck.push({ uid: uid(), id: fx.upId, up: true }); return 'Nytt kort: ' + plain(CARDS[fx.upId].name) + '+'; }
  if (fx.upRandom) { const list = S.deck.filter(x => !x.up && CARDS[x.id].up); if (list.length) return upgradeCard(pick(list)); S.kollekt += 10; return '+10 kr i kollekten'; }
  return '';
}
function nodeOption(v) {
  const n = S.node; if (!n) return;
  if (v === 'menu' || v === 'up' || v === 'trim') { n.stage = v; render(); screenEl().firstElementChild.scrollTop = 0; }
}
function pickDeck(u) {
  const n = S.node; const c = S.deck.find(x => x.uid === u); if (!n || !c) return;
  if (n.stage === 'up') { if (c.up) return; n.msg = upgradeCard(c) + '. Kocken applåderar.'; n.card = { id: c.id, up: true }; sfx('thread'); }
  else if (n.stage === 'trim') { if (S.deck.length <= 6) return; S.deck = S.deck.filter(x => x.uid !== u); n.msg = `Carl strök ${plain(CARDS[c.id].name)}${c.up ? '+' : ''} ur manuset. Det känns luftigare.`; n.card = null; sfx('card'); }
  n.stage = 'done'; render(); screenEl().firstElementChild.scrollTop = 0;
}
function buy(i) {
  const n = S.node; const s = n && n.stock[i]; if (!s || s.sold) return;
  if (S.kollekt < s.price) { sfx('nope'); toast(`Kollekten räcker inte riktigt. Carl har ${S.kollekt} kr.`, $('.node-body')); return; }
  S.kollekt -= s.price; s.sold = true; S.deck.push({ uid: uid(), id: s.id, up: false }); sfx('coin'); render();
}
function eventChoice(i) {
  const n = S.node; if (!n || n.out) return;
  const ev = EVENTS.find(e => e.id === n.ev); const o = ev.opts[i];
  n.reward = applyEventFx(o.fx); n.out = o.out; render();
}

/* ---------- input ---------- */
function act(a, el) {
  if (UI.moving) return;
  const i = el.dataset.i != null && el.dataset.i !== '' ? +el.dataset.i : null;
  switch (a) {
    case 'start': newRun(); UI.title = false; render(); break;
    case 'continue': UI.title = false; if (S.battle) S.battle.busy = false; render(); break;
    case 'again': newRun(); UI.title = false; render(); break;
    case 'menu': UI.title = true; UI.deck = false; render(); break;
    case 'help': UI.help = true; render(); break;
    case 'deck': UI.deck = true; render(); break;
    case 'closeSheet': if (UI.help) UI.help = false; else if (UI.deck) UI.deck = false; else if (S && S.sheet === 'arrival') S.sheet = null; render(); break;
    case 'sound': muted = !muted; try { localStorage.setItem(KEYM, muted ? '1' : '0'); } catch (e) {} if (!muted) { ensureAudio(); sfx('coin'); } render(); break;
    case 'arrival': S.sheet = 'arrival'; render(); break;
    case 'church': startBattle(); render(); setTimeout(() => bigText('Söndag i ' + STATIONS[S.battle.st].name), 150); break;
    case 'travel': travel(); break;
    case 'fork': chooseFork(i); break;
    case 'enterNode': enterNode(); break;
    case 'card': onCard(i, el); break;
    case 'seat': onSeat(i); break;
    case 'endTurn': endTurn(); break;
    case 'toReward': S.sheet = 'reward'; render(); break;
    case 'reward': if (S.rewardOpts[i]) { S.deck.push({ uid: uid(), id: S.rewardOpts[i], up: false }); sfx('coin'); } afterBattle(); break;
    case 'rewardSkip': afterBattle(); break;
    case 'toEnd': S.screen = 'end'; S.sheet = null; S.battle = null; S.tutorial = false; render(); break;
    case 'nodeOpt': nodeOption(el.dataset.v); break;
    case 'pickDeck': pickDeck(el.dataset.uid); break;
    case 'buy': buy(i); break;
    case 'event': eventChoice(i); break;
    case 'nodeDone': S.node = null; S.screen = 'map'; S.rowDone = true; render(); break;
    default: break;
  }
}
document.getElementById('app').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  ensureAudio(); act(t.dataset.act, t);
});

/* ---------- boot ---------- */
function boot(data) {
  if (data && data.S) { S = data.S; Object.assign(UI, data.UI || {}); UI.moving = false; UI.trainFrom = null; if (S.battle) S.battle.busy = false; }
  else { S = load(); UI.title = true; if (S && S.battle) S.battle.busy = false; }
  render();
}
const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ S, UI: { title: UI.title, help: UI.help, deck: UI.deck } })); } catch (e) {}
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
