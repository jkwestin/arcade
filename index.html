<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Arcade</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-color: #58a6ff;
      --text-color: #c9d1d9;
      --text-muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    header p { color: var(--text-muted); }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-color);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    /* Thumbnail container & Fallback rules */
    .thumb-container {
      width: 100%;
      height: 160px;
      background-color: #21262d;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .thumb-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
      position: absolute;
      top: 0;
      left: 0;
    }

    .game-card:hover .thumb-container img {
      transform: scale(1.05);
    }

    .placeholder-icon {
      font-size: 3rem;
      user-select: none;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .game-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 0.4rem;
      text-transform: capitalize;
    }

    .game-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .game-link {
      font-size: 0.9rem;
      color: var(--accent-color);
      font-weight: bold;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      padding: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>🕹️ Web Arcade</h1>
    <p>Select a game below to play directly in your browser</p>
  </header>

  <main>
    <div id="games-grid" class="games-grid">
      <div class="status-msg">Scanning repository for games...</div>
    </div>
  </main>

  <script>
    // CONFIGURATION: Update with your exact GitHub username and repository name
    const GITHUB_USERNAME = 'jkwestin';
    const REPO_NAME = 'arcade';
    
    // File name used for preview images inside each game subfolder
    const THUMBNAIL_FILENAME = 'cover.png';

    async function loadGames() {
      const grid = document.getElementById('games-grid');
      const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        
        const items = await response.json();
        
        // Filter out folders, ignoring system folders starting with '.'
        const gameFolders = items.filter(item => item.type === 'dir' && !item.name.startsWith('.'));

        if (gameFolders.length === 0) {
          grid.innerHTML = '<div class="status-msg">No game subfolders found yet. Add a game folder to get started!</div>';
          return;
        }

        grid.innerHTML = ''; // Clear loading message

        gameFolders.forEach(folder => {
          const formattedTitle = folder.name.replace(/-/g, ' ');
          const gamePath = `./${folder.name}/`;
          const imagePath = `${gamePath}${THUMBNAIL_FILENAME}`;

          const card = document.createElement('a');
          card.className = 'game-card';
          card.href = gamePath;
          card.innerHTML = `
            <div class="thumb-container">
              <span class="placeholder-icon">🕹️</span>
              <img src="${imagePath}" 
                   alt="${formattedTitle}" 
                   onerror="this.style.display='none';" />
            </div>
            <div class="card-body">
              <div>
                <div class="game-title">${formattedTitle}</div>
                <div class="game-desc">Play ${formattedTitle} online</div>
              </div>
              <div class="game-link">Play Now &rarr;</div>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        grid.innerHTML = `<div class="status-msg">Error loading games (${error.message}). Check GITHUB_USERNAME and REPO_NAME in index.html.</div>`;
      }
    }

    loadGames();
  </script>
</body>
</html>
