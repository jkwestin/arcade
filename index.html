<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Arcade</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-color: #58a6ff;
      --text-color: #c9d1d9;
      --text-muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    header p { color: var(--text-muted); }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
    }

    .game-title {
      font-size: 1.25rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
      text-transform: capitalize;
    }

    .game-link {
      font-size: 0.9rem;
      color: var(--accent-color);
      font-weight: bold;
      margin-top: 1rem;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <h1>🕹️ Web Arcade</h1>
    <p>Select a game below to play directly in your browser</p>
  </header>

  <main>
    <div id="games-grid" class="games-grid">
      <div class="status-msg">Scanning repository for games...</div>
    </div>
  </main>

  <script>
    // CONFIGURATION: Replace these values with your details
    const GITHUB_USERNAME = 'YOUR_USERNAME';
    const REPO_NAME = 'arcade';

    async function loadGames() {
      const grid = document.getElementById('games-grid');
      const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Failed to fetch repository contents');
        
        const items = await response.json();
        
        // Filter out folders, ignoring system folders starting with '.'
        const gameFolders = items.filter(item => item.type === 'dir' && !item.name.startsWith('.'));

        if (gameFolders.length === 0) {
          grid.innerHTML = '<div class="status-msg">No game subfolders found yet. Add a game folder to get started!</div>';
          return;
        }

        grid.innerHTML = ''; // Clear status message

        gameFolders.forEach(folder => {
          // Convert folder names like "space-runner" to "Space Runner"
          const formattedTitle = folder.name.replace(/-/g, ' ');

          const card = document.createElement('a');
          card.className = 'game-card';
          card.href = `./${folder.name}/`;
          card.innerHTML = `
            <div>
              <div class="game-title">${formattedTitle}</div>
              <p style="font-size:0.85rem; color: var(--text-muted);">Play ${formattedTitle} online</p>
            </div>
            <div class="game-link">Play Now &rarr;</div>
          `;
          grid.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        grid.innerHTML = '<div class="status-msg">Error loading games. Please verify your repository configuration.</div>';
      }
    }

    loadGames();
  </script>
</body>
</html>
