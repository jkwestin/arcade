/* =========================================================
   Tomtens räkneverkstad – julkalender med plus/minus 0–10
   ========================================================= */
const W = 720, H = 1280;
const FONT = 'Fredoka, system-ui, "Segoe UI", Roboto, Arial, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
const N_Q = 6;                                   // uppgifter per lucka
const GAMES = ['Paket', 'Kakor', 'Snoboll'];     // roterar lucka för lucka
const GAME_NAMES = { Paket: 'Paketlagret', Kakor: 'Pepparkaksbageriet', Snoboll: 'Snöbollskriget' };
const GAME_ICON = { Paket: '🎁', Kakor: '🍪', Snoboll: '❄️' };


/* ---------- Sparning ---------- */
const SAVE_KEY = 'tomtens-rakneverkstad-v1';
let save = { done: {}, stats: {}, sfxOff: false, musicOff: false };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s && s.done) save = Object.assign(save, s);
  if (save.muted) { save.sfxOff = save.musicOff = true; } delete save.muted;   // äldre sparformat
} catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function doneCount() { return Object.keys(save.done).length; }
function isUnlocked(d) { return d === 1 || !!save.done[d - 1] || !!save.done[d]; }
function record(key, ok) {
  const s = save.stats[key] || (save.stats[key] = { r: 0, w: 0 });
  ok ? s.r++ : s.w++;
  persist();
}

/* ---------- Uppgifter ---------- */
const FACTS = [];
for (let a = 0; a <= 10; a++) for (let b = 0; b <= 10; b++) {
  if (a + b <= 10) FACTS.push({ a, b, op: '+', r: a + b });
  if (a - b >= 0) FACTS.push({ a, b, op: '-', r: a - b });
}
const factKey = f => f.a + f.op + f.b;

// Svårighet stiger lucka för lucka
function stage(day) {
  if (day <= 4)  return { ops: ['+'], max: 6, miss: 0 };
  if (day <= 8)  return { ops: ['+'], max: 10, miss: 0 };
  if (day <= 10) return { ops: ['-'], max: 6, miss: 0 };
  if (day <= 14) return { ops: ['-'], max: 10, miss: 0 };
  if (day <= 18) return { ops: ['+', '-'], max: 10, miss: 0.25 };
  return { ops: ['+', '-'], max: 10, miss: 0.4 };
}
// Uppgifter barnet svarat fel på kommer oftare
function weightOf(f) {
  const s = save.stats[factKey(f)] || { r: 0, w: 0 };
  let w = 1 + 2.5 * Math.max(0, s.w - 0.5 * s.r);
  if (f.a === 0 || f.b === 0) w *= 0.35;
  if (s.r >= 3 && s.w === 0) w *= 0.5;
  return w;
}
function makeProblem(day, used) {
  const st = stage(day);
  let pool = FACTS.filter(f => st.ops.includes(f.op) && f.a <= st.max && (f.op === '-' || f.r <= st.max));
  const fresh = pool.filter(f => !used.has(factKey(f)));
  if (fresh.length) pool = fresh;
  const ws = pool.map(weightOf);
  let r = Math.random() * ws.reduce((x, y) => x + y, 0);
  let f = pool[pool.length - 1];
  for (let i = 0; i < pool.length; i++) { r -= ws[i]; if (r <= 0) { f = pool[i]; break; } }
  const missing = Math.random() < st.miss;
  return Object.assign({}, f, { key: factKey(f), missing, answer: missing ? f.b : f.r });
}
function makeChoices(ans) {
  const s = new Set([ans]);
  const near = Phaser.Utils.Array.Shuffle([ans - 1, ans + 1, ans - 2, ans + 2, ans + 3, ans - 3].filter(v => v >= 0 && v <= 10));
  for (const v of near) { if (s.size >= 4) break; s.add(v); }
  while (s.size < 4) s.add(Phaser.Math.Between(0, 10));
  return Phaser.Utils.Array.Shuffle([...s]);
}
function problemString(p, solved) {
  const sym = p.op === '+' ? '+' : '−';
  const q = solved ? String(p.answer) : '?';
  return p.missing ? `${p.a} ${sym} ${q} = ${p.r}` : `${p.a} ${sym} ${p.b} = ${q}`;
}

/* ---------- Ljud: korta syntljud ---------- */
let actx = null;
function ctx() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function unlockAudio() { try { const c = ctx(); if (c.state === 'suspended') c.resume(); } catch (e) {} }
// Enkla syntljud för rätt/fel, kräver inga filer
function beep(type) {
  if (save.sfxOff) return;
  try {
    const c = ctx(), now = c.currentTime;
    const notes = type === 'ok' ? [784, 1047] : type === 'win' ? [523, 659, 784, 1047] : [220, 175];
    notes.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type === 'bad' ? 'triangle' : 'sine';
      o.frequency.value = f;
      const t0 = now + i * 0.11;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + 0.3);
    });
  } catch (e) {}
}

/* ---------- Julmusik: medley av fria (public domain) melodier ----------

    ch: 'R:1 C:3 F:3 D:3 G:3 E:3 F:3 G:3 C:3' },
  { name: 'Hej tomtegubbar, variation 2 (trad.)', bpm: 128, meter: 3, pickup: 0.5, swing: 0.56, bells: 1,

    ch: 'R:0.5 D:3 A:2 D:1 A:1 D:2 A:1 E:1 A:1 D:3 A:2 D:1 A:1 D:2 A:1 D:2 D:1 A:2 D:1 A:2 D:1 A:2 E:1 A:2 D:3 A:2 D:1 A:1 D:2 A:1 D:2' },
  { name: 'Deck the Halls (walesisk trad.)', bpm: 144, meter: 4, swing: 0.71, bells: 1,
    mel: 'G5:1.5 F5:0.5 E5:1 D5:1 C5:1 D5:1 E5:1 C5:1 D5:0.5 E5:0.5 F5:0.5 D5:0.5 E5:1.5 D5:0.5 C5:1 B4:1 C5:2 ' +
         'G5:1.5 F5:0.5 E5:1 D5:1 C5:1 D5:1 E5:1 C5:1 D5:0.5 E5:0.5 F5:0.5 D5:0.5 E5:1.5 D5:0.5 C5:1 B4:1 C5:2',
    ch: 'C:4 C:4 G:4 C:4 C:4 C:4 G:4 C:4' },
  { name: 'Joy to the World (Händel/Mason, 1839)', bpm: 116, meter: 4, swing: 0.70, bells: 0,
    mel: 'C5:1 B4:0.75 A4:0.25 G4:1.5 F4:0.5 E4:1 D4:1 C4:2 G4:0.5 A4:1.5 A4:0.5 B4:1.5 B4:0.5 C5:3.5',
    ch: 'C:4 G:2 C:2 C:0.5 F:2 G:2 C:3.5' }
];
// Ackord: grundton i basläge (alla durackord)
const CHORDS = { A: 'A2', C: 'C3', D: 'D3', E: 'E2', F: 'F2', G: 'G2' };
function noteMidi(n) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(n);
  return 12 * (+m[3] + 1) + { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);
function noteFreq(n) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(n);
  const semi = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return 440 * Math.pow(2, (12 * (+m[3] + 1) + semi - 69) / 12);
}
const parseSeq = s => s.trim().split(/\s+/).map(x => { const [n, d] = x.split(':'); return [n, +d]; });

const Music = {
  on: false, timer: null, ev: null, total: 0, idx: 0, start0: 0, out: null, noise: null,
  build() {
    const ev = []; let T = 0;
    const push = (k, t, o = {}) => ev.push(Object.assign({ k, t }, o));
    for (const s of MEDLEY) {
      const spb = 60 / s.bpm, M = s.meter || 4, pu = s.pickup || 0, sw = s.swing || 0.5;
      // Swing: andra åttondelen i varje slag skjuts senare
      const map = x => { const B = Math.floor(x), f = x - B; return B + (f < 0.5 ? f * sw / 0.5 : sw + (f - 0.5) * (1 - sw) / 0.5); };
      const tm = b => T + (pu + map(b - pu)) * spb;
      const bb = b => (((b - pu) % M) + M) % M;           // slag i takten
      // Ackordtidslinje (för andrastämman)
      const chordAt = []; let cpos = 0;
      for (const [c, d] of parseSeq(s.ch)) { chordAt.push({ a: cpos, b: cpos + d, c }); cpos += d; }
      const chordOf = b => { const x = chordAt.find(z => b >= z.a - 1e-6 && b < z.b - 1e-6); return x && x.c !== 'R' ? x.c : null; };
      let len = 0;
      for (const [n, d] of parseSeq(s.mel)) {
        if (n !== 'R') {
          const dur = (tm(len + d) - tm(len)) * 0.88;
          push('m', tm(len), { f: noteFreq(n), d: dur });
          // Andrastämma: närmaste ackordton minst en liten ters under melodin (ej på snabba sextondelar)
          const c = chordOf(len);
          if (c && d >= 0.5) {
            const mm = noteMidi(n), rp = noteMidi(CHORDS[c]) % 12, pcs = [rp, (rp + 4) % 12, (rp + 7) % 12];
            for (let h = mm - 3; h >= mm - 9; h--) if (pcs.includes(((h % 12) + 12) % 12)) {
              push('h2', tm(len), { f: midiFreq(h), d: dur }); break;
            }
          }
        }
        len += d;
      }
      // Bas + ackordstötar
      let cb = 0;
      for (const [c, d] of parseSeq(s.ch)) {
        if (c !== 'R') {
          const root = noteFreq(CHORDS[c]);
          const tri = [1, Math.pow(2, 4 / 12), Math.pow(2, 7 / 12)].map(r => root * 4 * r);
          for (let i = 0; i < d; i++) {
            const b = cb + i, k = Math.floor(bb(b) + 1e-6) % M;
            if (M === 4) {
              const step = [1, 1.5, 2, 1.5][k];                 // grund, kvint, oktav, kvint
              push('b', tm(b), { f: root * step, d: spb * 0.55 });
              if (k === 3) push('b', tm(b + 0.5), { f: root * Math.pow(2, 9 / 12), d: spb * 0.3, v: 0.7 }); // sext som upptakt
              push('s', tm(b + 0.5), { fs: tri, d: spb * 0.22 });  // stöt på baktakten
            } else {
              if (k === 0) push('b', tm(b), { f: root, d: spb * 0.8 });
              else push('s', tm(b), { fs: tri, d: spb * 0.3 });   // um-pa-pa
            }
          }
        }
        cb += d;
      }
      // Trummor
      const fillFrom = len - 2;
      for (let q = Math.ceil(pu * 2) / 2; q < len - 0.01; q += 0.5) {
        const k = bb(q);
        if (q >= fillFrom) {                                  // virvelfill före nästa låt
          push('sn', tm(q), { v: 0.5 + 0.5 * (q - fillFrom) / 2 });
          if (k === 0) push('k', tm(q));
          continue;
        }
        if (M === 4) {
          if (k === 0 || k === 2 || k === 2.5) push('k', tm(q), { v: k === 2.5 ? 0.6 : 1 });
          if (k === 1 || k === 3) push('sn', tm(q));
        } else {
          if (k === 0) push('k', tm(q));
          if (k === 1 || k === 2) push('sn', tm(q), { v: 0.45 });
        }
        push('h', tm(q), { v: q % 1 ? 0.6 : 1 });
        if (s.bells && q % 1 === 0) push('n', tm(q), { v: 0.8 });
      }
      T = tm(len) + spb;                                       // ett slags paus
    }
    this.ev = ev.sort((a, b) => a.t - b.t);
    this.total = T;
  },
  sync() { save.musicOff ? this.stop() : this.start(); },
  start() {
    if (this.on) return;
    try {
      const c = ctx();
      if (!this.ev) this.build();
      if (!this.noise) {
        this.noise = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate);
        const d = this.noise.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      this.out = c.createGain();
      this.out.gain.setValueAtTime(0.0001, c.currentTime);
      this.out.gain.exponentialRampToValueAtTime(0.5, c.currentTime + 1.2);
      this.out.connect(c.destination);
      this.start0 = c.currentTime + 0.3; this.idx = 0; this.on = true;
      this.timer = setInterval(() => this.tick(), 60);
      this.tick();
    } catch (e) {}
  },
  stop() {
    if (!this.on) return;
    this.on = false; clearInterval(this.timer);
    const g = this.out, c = ctx();
    g.gain.setTargetAtTime(0.0001, c.currentTime, 0.15);
    setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 1000);
  },
  tick() {
    const c = ctx(), now = c.currentTime, until = now + 0.4;
    if (now - this.start0 > this.total) {   // hoppa fram om vi legat efter
      this.start0 += Math.floor((now - this.start0) / this.total) * this.total; this.idx = 0;
    }
    for (;;) {
      if (this.idx >= this.ev.length) { this.idx = 0; this.start0 += this.total; }
      const e = this.ev[this.idx], t = this.start0 + e.t;
      if (t > until) break;
      if (t > now - 0.02) this.play(e, t);
      this.idx++;
    }
  },
  play(e, t) {
    const c = ctx(), out = this.out, v = e.v === undefined ? 1 : e.v;
    const env = (g, peak, a, rel) => {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + rel);
    };
    const noise = (type, freq, q) => {
      const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      s.buffer = this.noise; f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
      s.connect(f); f.connect(g); g.connect(out); return [s, g];
    };
    if (e.k === 'h2') {                      // andrastämma: varm, lätt detunad sågtand
      const f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'lowpass'; f.frequency.value = 1500; f.Q.value = 0.5;
      f.connect(g); g.connect(out);
      for (const det of [-7, 7]) {
        const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = e.f; o.detune.value = det;
        o.connect(f); o.start(t); o.stop(t + e.d + 0.2);
      }
      const hold = Math.max(0.12, e.d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.052, t + 0.03);
      g.gain.setValueAtTime(0.052, t + hold);
      g.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.15);
      return;
    }
    if (e.k === 'm') {                       // melodi: klocklik triangel + oktav
      const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), g2 = c.createGain();
      o.type = 'triangle'; o.frequency.value = e.f;
      o2.type = 'sine'; o2.frequency.value = e.f * 2; g2.gain.value = 0.3;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(out);
      const hold = Math.max(0.09, e.d), dec = Math.min(0.25, hold * 0.8);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.07, t + dec);
      g.gain.setValueAtTime(0.07, t + hold);
      g.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.12);
      o.start(t); o2.start(t); o.stop(t + hold + 0.2); o2.stop(t + hold + 0.2);
    } else if (e.k === 'b') {                // bas: rund triangel med lite "plock"
      const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
      o.type = 'triangle'; o.frequency.value = e.f;
      f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(250, t + e.d);
      o.connect(f); f.connect(g); g.connect(out);
      env(g, 0.22 * v, 0.008, e.d);
      o.start(t); o.stop(t + e.d + 0.05);
    } else if (e.k === 's') {                // ackordstöt
      const f = c.createBiquadFilter(), g = c.createGain();
      f.type = 'lowpass'; f.frequency.value = 2200;
      f.connect(g); g.connect(out);
      for (const fr of e.fs) {
        const o = c.createOscillator(); o.type = 'square'; o.frequency.value = fr;
        o.connect(f); o.start(t); o.stop(t + e.d + 0.05);
      }
      env(g, 0.05, 0.005, e.d);
    } else if (e.k === 'k') {                // bastrumma
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      o.connect(g); g.connect(out);
      env(g, 0.3 * v, 0.004, 0.2);
      o.start(t); o.stop(t + 0.25);
    } else if (e.k === 'sn') {               // virvel
      const [s, g] = noise('bandpass', 1900, 0.8);
      env(g, 0.22 * v, 0.003, 0.14);
      s.start(t); s.stop(t + 0.16);
      const o = c.createOscillator(), og = c.createGain();
      o.type = 'triangle'; o.frequency.value = 190; o.connect(og); og.connect(out);
      env(og, 0.07 * v, 0.003, 0.07);
      o.start(t); o.stop(t + 0.08);
    } else if (e.k === 'h') {                // hihat
      const [s, g] = noise('highpass', 8500);
      env(g, 0.035 * v, 0.002, 0.04);
      s.start(t); s.stop(t + 0.05);
    } else {                                 // bjällror
      const [s, g] = noise('highpass', 6500);
      env(g, 0.05 * v, 0.005, 0.16);
      s.start(t); s.stop(t + 0.18);
    }
  }
};

function txt(scene, x, y, s, size, color = '#ffffff', extra = {}) {

function statsSummary() {
  let r = 0, w = 0, rp = 0, wp = 0, rm = 0, wm = 0;
  for (const [k, v] of Object.entries(save.stats)) {
    r += v.r; w += v.w;
    if (k.includes('+')) { rp += v.r; wp += v.w; } else { rm += v.r; wm += v.w; }
  }
  const pct = (a, b) => a + b ? Math.round(100 * a / (a + b)) + ' %' : '–';
  const stars = Object.values(save.done).reduce((a, b) => a + b, 0);
  return { n: r + w, all: pct(r, w), plus: pct(rp, wp), minus: pct(rm, wm), stars };
}
function accColor(v) {
  const n = v.r + v.w; if (!n) return 0x2a3f63;
  const a = v.r / n;
  if (a >= 0.85) return 0x2fae5b;
  if (a >= 0.6) return 0xe8c13a;
  return 0xd8434f;
}

class BaseGame extends Phaser.Scene {
  init(data) {
    this.day = (data && data.day) || 1;
    this.qIndex = 0; this.mistakes = 0; this.used = new Set(); this.busy = false;
  }
  create() {
    this.cameras.main.fadeIn(250);
    bg(this); addSnow(this);
    this.buildHud();
    this.buildWorld();
    this.nextProblem(true);
  }
  buildHud() {
    button(this, 65, 62, 90, 90, '◀', 0x0e2a52, () => { this.scene.start('Calendar'); }, 44);
    menuButton(this, 655, 62);
    this.dots = [];
    for (let i = 0; i < N_Q; i++) {
      this.dots.push(this.add.circle(360 + (i - (N_Q - 1) / 2) * 52, 52, 17, 0x0e2a52).setStrokeStyle(4, 0xffffff, 0.8));
    }
  }
  fillDot(i) {
    const d = this.dots[i]; if (!d) return;
    d.setFillStyle(0xf4c542);
    this.tweens.add({ targets: d, scale: 1.4, duration: 150, yoyo: true });
  }
  nextProblem(first = false) {
    if (this.qIndex >= N_Q) return this.finish();
    const p = makeProblem(this.day, this.used);
    this.used.add(p.key);
    this.p = p; this.firstTry = true; this.busy = false;
    this.showProblem(p, makeChoices(p.answer));
  }
  answer(v, target) {
    if (this.busy) return;
    if (v === this.p.answer) {
      this.busy = true;
      if (this.firstTry) record(this.p.key, true);
      beep('ok');
      this.fillDot(this.qIndex);
      this.onCorrect(target, () => { this.qIndex++; this.nextProblem(); });
    } else {
      if (this.firstTry) { record(this.p.key, false); this.mistakes++; this.firstTry = false; }
      beep('bad');
      this.onWrong(target);
    }
  }
  shakeOut(obj) {
    const x0 = obj.x;
    this.tweens.add({ targets: obj, x: x0 + 14, duration: 50, yoyo: true, repeat: 3, onComplete: () => obj.x = x0 });
    obj.setAlpha(0.35);
    obj.disableInteractive();
  }
  finish() {
    this.busy = true;
    const stars = this.mistakes === 0 ? 3 : this.mistakes <= 2 ? 2 : 1;
    const first = !save.done[this.day];
    save.done[this.day] = Math.max(save.done[this.day] || 0, stars);
    persist();
    beep('win');

    const ov = this.add.container(0, 0).setDepth(100);
    const dim = this.add.rectangle(360, 640, 720, 1280, 0x000000, 0.6).setInteractive();
    const panel = this.add.graphics();
    panel.fillStyle(0x0e2a52, 1).fillRoundedRect(80, 330, 560, 660, 40);
    panel.lineStyle(6, 0xf4c542, 1).strokeRoundedRect(80, 330, 560, 660, 40);
    ov.add([dim, panel, txt(this, 360, 420, '🎉', 90)]);
    [0, 1, 2].forEach(i => {
      const s = txt(this, 240 + i * 120, 560, '★', 120, i < stars ? '#f4c542' : '#3a4f73').setScale(0);
      ov.add(s);
      this.tweens.add({ targets: s, scale: 1, duration: 350, delay: 250 + i * 250, ease: 'Back.out' });
    });
    if (first) { const o = txt(this, 360, 700, '🎄', 110).setScale(0); ov.add(o); this.tweens.add({ targets: o, scale: 1, delay: 1000, duration: 400, ease: 'Back.out' }); }
    ov.add(button(this, 240, 870, 200, 140, '▶', 0x1f7a3a, () => {
      this.scene.start('Calendar', { newOrn: first });
    }, 70));
    ov.add(button(this, 480, 870, 200, 140, '↻', 0xc8102e, () => {
      this.scene.restart({ day: this.day });
    }, 70));
    const conf = this.add.particles(360, 380, 'flake', {
      speed: { min: 250, max: 550 }, angle: { min: 200, max: 340 }, gravityY: 700,
      lifespan: 2200, scale: { start: 1.1, end: 0.5 },
      tint: [0xf4c542, 0xe63946, 0x4cc9f0, 0x45c167, 0xffffff], emitting: false
    }).setDepth(101);
    conf.explode(70);
  }
}

    ch.forEach((v, i) => {
      const x = i % 2 ? 525 : 195, y = i < 2 ? 1015 : 1170;
      const b = button(this, x, y, 290, 135, String(v), (i === 0 || i === 3) ? 0xc8102e : 0x1f7a3a, () => this.answer(v, b), 90);
      b.setScale(0);
      this.tweens.add({ targets: b, scale: 1, duration: 260, delay: i * 60, ease: 'Back.out' });
      this.btns.push(b);
    });
  }
  drawVis(p) {
    this.vis.removeAll(true);
    const add = o => { this.vis.add(o); return o; };
    const MID = 515, AREA = 480;             // bildytan ca 275–755
    const gift = (x, y, tex, S, crossed) => {
      const im = add(this.add.image(x, y, tex).setDisplaySize(S * 0.94, S * 0.94));
      if (crossed) {
        im.setAlpha(0.3);
        const k = S * 0.32;
        add(this.add.graphics().lineStyle(9, 0xff3b3b, 1)
          .lineBetween(x - k, y - k, x + k, y + k).lineBetween(x + k, y - k, x - k, y + k));
      }
    };
    const sign = (x, y, s) => add(txt(this, x, y, s, 64, '#ffffff', { stroke: '#0b1d3a', strokeThickness: 8 }));

    // Lätt plus (a+b ≤ 4): allt på en rad, röda + gröna
    if (!p.missing && p.op === '+' && p.a + p.b <= 4) {
      const S = 130, gap = 80, w = (p.a + p.b) * S + (p.a && p.b ? gap : 0);
      let x = 360 - w / 2 + S / 2;
      for (let i = 0; i < p.a; i++, x += S) gift(x, MID, 'giftR', S);
      if (p.a && p.b) { sign(x - S / 2 + gap / 2, MID, '+'); x += gap; }
      for (let i = 0; i < p.b; i++, x += S) gift(x, MID, 'giftG', S);
    } else {
      // Annars staplat: grupper i rader om 5 (som en tiorsram)
      const parts = [];
      if (p.missing) {
        parts.push({ n: p.a, tex: 'giftR' }, { s: p.op === '+' ? '+ ?' : '− ?' }, { s: '=' }, { n: p.r, tex: 'ghost' });
      } else if (p.op === '+') {
        parts.push({ n: p.a, tex: 'giftR' }, { s: '+' }, { n: p.b, tex: 'giftG' });
      } else {
        parts.push({ n: p.a, tex: 'giftR', crossFrom: p.a - p.b });
      }
      const rows = parts.reduce((t, q) => t + (q.s ? 0 : Math.ceil(q.n / 5)), 0);
      const signs = parts.filter(q => q.s).length;
      const S = Math.min(130, 136, (AREA - signs * 62) / Math.max(1, rows));
      const hOf = q => q.s ? 62 : Math.ceil(q.n / 5) * S;
      const total = parts.reduce((t, q) => t + hOf(q), 0);
      let y = MID - total / 2;
      for (const q of parts) {
        if (q.s) { sign(360, y + 31, q.s); y += 62; continue; }
        for (let i = 0; i < q.n; i++) {
          const r = Math.floor(i / 5), inRow = Math.min(5, q.n - r * 5), k = i % 5;
          gift(360 + (k - (inRow - 1) / 2) * S, y + r * S + S / 2, q.tex, S,
            q.crossFrom !== undefined && i >= q.crossFrom);
        }
        y += hOf(q);
      }
    }
    this.vis.setAlpha(0);
    this.tweens.add({ targets: this.vis, alpha: 1, duration: 300 });
  }
  onCorrect(btn, done) {
    this.qText.setText(problemString(this.p, true)).setColor('#7CFC9A');
    const gift = this.add.image(btn.x, btn.y, this.loaded % 2 ? 'giftG' : 'giftR').setScale(1).setDepth(5);
    const tx = 305 + (this.loaded % 3) * 30, ty = 825 - Math.floor(this.loaded / 3) * 24;
    this.tweens.add({
      targets: gift, x: tx, y: ty, scale: 0.3, duration: 600, ease: 'Quad.inOut',
      onComplete: () => { this.loaded++; this.tweens.add({ targets: this.sleigh, y: '+=8', duration: 90, yoyo: true }); }
    });
    this.time.delayedCall(1100, done);
  }
  onWrong(btn) { this.shakeOut(btn); }
}

/* ---------- Minispel 2: Pepparkaksbageriet ---------- */
class Kakor extends BaseGame {
  constructor() { super('Kakor'); }
  buildWorld() {
    const g = this.add.graphics();
    g.fillStyle(0x7a4a26, 1).fillRect(0, 575, 720, 40);
    g.fillStyle(0x5e3519, 1).fillRect(0, 615, 720, 14);
    this.customer = txt(this, 140, 420, '🎅', 150);
    const b = this.add.graphics();
    b.fillStyle(0xffffff, 1).fillRoundedRect(250, 300, 440, 170, 34);
    b.fillTriangle(255, 390, 205, 420, 260, 430);
    this.qText = txt(this, 470, 385, '', 86, '#0b1d3a');
    this.trays = [];
  }
  showProblem(p, ch) {
    this.customer.setText(Phaser.Utils.Array.GetRandom(['🎅', '🤶', '🧝', '⛄', '🦌', '🐧', '🐻']));
    this.customer.x = -120;
    this.tweens.add({ targets: this.customer, x: 140, duration: 450, ease: 'Back.out' });
    this.qText.setText(problemString(p)).setColor('#0b1d3a');
    this.trays.forEach(t => t.destroy());
    this.trays = [];
    ch.forEach((v, i) => {
      const x = i % 2 ? 530 : 190, y = i < 2 ? 805 : 1100;
      const t = this.makeTray(v, x, y);
      t.setScale(0);
      this.tweens.add({ targets: t, scale: 1, duration: 260, delay: i * 70, ease: 'Back.out' });
      this.trays.push(t);
    });
  }
  makeTray(v, x, y) {
    const c = this.add.container(x, y);
    const g = this.add.graphics();
    g.fillStyle(0x000000, 0.25).fillRoundedRect(-141, -112, 290, 240, 24);
    g.fillStyle(0x8f99a3, 1).fillRoundedRect(-145, -120, 290, 240, 24);
    g.fillStyle(0xc9d1d9, 1).fillRoundedRect(-130, -105, 260, 210, 16);
    c.add(g);
    c.cookies = [];
    const perRow = 5, S = 50, rows = v > 5 ? 2 : 1;
    for (let i = 0; i < v; i++) {
      const r = Math.floor(i / perRow), k = i % perRow;
      const inRow = r === 0 ? Math.min(v, perRow) : v - perRow;
      const cx = (k - (inRow - 1) / 2) * S;
      const cy = rows === 2 ? (r === 0 ? 0 : 55) : 28;
      const im = this.add.image(cx, cy, 'cookie');
      c.add(im); c.cookies.push(im);
    }
    const badge = this.add.circle(-100, -78, 36, 0xc8102e).setStrokeStyle(4, 0xffffff);
    c.add([badge, txt(this, -100, -78, String(v), 46)]);
    c.setSize(290, 240).setInteractive({ useHandCursor: true });
    c.on('pointerdown', () => { unlockAudio(); this.answer(v, c); });
    return c;
  }
  onCorrect(tray, done) {
    this.qText.setText(problemString(this.p, true)).setColor('#1f7a3a');
    tray.cookies.forEach((ck, i) => {
      const wx = tray.x + ck.x, wy = tray.y + ck.y;
      tray.remove(ck);
      ck.setPosition(wx, wy).setDepth(5);
      this.add.existing(ck);
      this.tweens.add({ targets: ck, x: 140, y: 420, scale: 0.3, alpha: 0, duration: 500, delay: i * 50, ease: 'Quad.in' });
    });
    this.time.delayedCall(450 + tray.cookies.length * 50, () => {
      this.tweens.add({ targets: this.customer, y: 390, duration: 120, yoyo: true, repeat: 1 });
      const yum = txt(this, 230, 300, '😋', 70).setDepth(6);
      this.tweens.add({ targets: yum, y: 240, alpha: 0, duration: 900, onComplete: () => yum.destroy() });
    });
    this.time.delayedCall(1300 + tray.cookies.length * 50, done);
  }
  onWrong(tray) { this.shakeOut(tray); }
}

/* ---------- Minispel 3: Snöbollskriget ---------- */
class Snoboll extends BaseGame {
  constructor() { super('Snoboll'); }
  buildWorld() {
    this.qText = txt(this, 360, 250, '', 100, '#ffffff', { stroke: '#0b1d3a', strokeThickness: 12 });
    const g = this.add.graphics();
    g.fillStyle(0xeaf4ff, 1).fillEllipse(360, 1260, 1000, 300);
    this.thrower = txt(this, 360, 1150, '⛄', 150).setDepth(3);
    this.nissar = [];
    this.throwing = false;
  }
  showProblem(p, ch) {
    this.qText.setText(problemString(p)).setColor('#ffffff');
    this.nissar.forEach(n => { this.tweens.killTweensOf(n); n.destroy(); });
    this.nissar = [];
    const lanes = Phaser.Utils.Array.Shuffle([440, 600, 760, 920]);
    ch.forEach((v, i) => this.nissar.push(this.makeNisse(v, lanes[i])));
  }
  makeNisse(v, y) {
    const x = Phaser.Math.Between(150, 570);
    const c = this.add.container(x, y);
    const g = this.add.graphics();
    g.fillStyle(0x6b3e1f, 1).fillRect(-4, -30, 8, 30);
    g.fillStyle(0xfff8e7, 1).fillRoundedRect(-55, -98, 110, 72, 14);
    g.lineStyle(5, 0x8b5a2b, 1).strokeRoundedRect(-55, -98, 110, 72, 14);
    const num = txt(this, 0, -62, String(v), 54, '#0b1d3a');
    c.face = txt(this, 0, 32, '🧝', 100);
    c.add([g, num, c.face]);
    c.val = v;
    c.setSize(170, 190).setInteractive({ useHandCursor: true });
    c.on('pointerdown', () => { unlockAudio(); this.throwAt(c); });
    c.tw = this.tweens.add({
      targets: c, x: x < 360 ? 590 : 130, duration: Phaser.Math.Between(5000, 8000),
      yoyo: true, repeat: -1, ease: 'Sine.inOut'
    });
    c.setScale(0);
    this.tweens.add({ targets: c, scale: 1, duration: 300, ease: 'Back.out' });
    return c;
  }
  throwAt(c) {
    if (this.busy || this.throwing || c.out) return;
    this.throwing = true;
    c.tw.pause();
    this.tweens.add({ targets: this.thrower, angle: -12, duration: 100, yoyo: true });
    const ball = this.add.image(360, 1080, 'ball').setDepth(10);
    this.tweens.add({
      targets: ball, x: c.x, y: c.y + 20, scale: 0.65, duration: 380, ease: 'Quad.out',
      onComplete: () => {
        this.throwing = false;
        const splat = this.add.circle(ball.x, ball.y, 26, 0xffffff, 0.9).setDepth(9);
        this.tweens.add({ targets: splat, scale: 2.2, alpha: 0, duration: 350, onComplete: () => splat.destroy() });
        ball.destroy();
        this.answer(c.val, c);
      }
    });
  }
  onCorrect(c, done) {
    this.qText.setText(problemString(this.p, true)).setColor('#7CFC9A');
    const hit = txt(this, c.x, c.y - 140, '💥', 80).setDepth(11);
    this.tweens.add({ targets: hit, y: hit.y - 50, alpha: 0, duration: 900, delay: 300, onComplete: () => hit.destroy() });
    this.tweens.add({ targets: c, angle: 360, y: c.y + 60, alpha: 0, scale: 0.5, duration: 800, ease: 'Quad.in' });
    this.nissar.forEach(n => { if (n !== c) n.tw.pause(); });
    this.time.delayedCall(1100, done);
  }
  onWrong(c) {
    c.out = true;
    c.face.setText('😜');
    c.setAlpha(0.4);
    c.disableInteractive();
    this.time.delayedCall(700, () => { if (c.face && c.face.active) c.face.setText('🧝'); });
    c.tw.resume();
  }
}
